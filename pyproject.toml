[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AscendMOEA"
version = "1.0.0"
description = "Tensorized multi-objective evolutionary optimization for Huawei Ascend NPUs and CPUs"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-AscendMOEA-Research"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "党乾龙" }]
keywords = [
  "multi-objective optimization",
  "evolutionary computation",
  "tensorization",
  "Huawei Ascend",
  "NPU",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
experiment = ["pandas>=2.0,<3"]
plot = ["plotly>=5.0,<7", "kaleido>=0.2,<2"]
accelerator = ["numba>=0.60,<1"]
dev = [
  "build>=1.2",
  "pandas>=2.0,<3",
  "plotly>=5.0,<7",
  "pytest>=8",
  "ruff>=0.8",
]
all = [
  "numba>=0.60,<1",
  "pandas>=2.0,<3",
  "plotly>=5.0,<7",
  "kaleido>=0.2,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ascendmoea = ["vendor/**/*.mat"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
