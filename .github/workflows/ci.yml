name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      ASCENDMOEA_DEVICE: cpu
      ASCENDMOEA_CPU_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.1,<3"
          python -m pip install -e ".[dev]"
      - name: Verify CPU-only PyTorch
        run: |
          python - <<'PY'
          import torch

          if torch.version.cuda is not None:
              raise RuntimeError(f"Expected a CPU-only PyTorch build, found CUDA {torch.version.cuda}")
          print(f"torch={torch.__version__} cuda={torch.version.cuda}")
          PY
      - name: Check release hygiene
        run: python tools/check_release.py
      - name: Lint
        run: python -m ruff check src tests examples tools
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate public catalogs on CPU
        run: >-
          python tools/validate_release.py --device cpu --cpu-threads 1
          --output validation-results/cpu.json
      - name: Build distributions
        run: python -m build
