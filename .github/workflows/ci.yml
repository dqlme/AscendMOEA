name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      ASCENDMOEA_DEVICE: cpu
      ASCENDMOEA_CPU_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check release hygiene
        run: python tools/check_release.py
      - name: Lint
        run: python -m ruff check src tests examples tools
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate public catalogs on CPU
        run: >-
          python tools/validate_release.py --device cpu --cpu-threads 1
          --output validation-results/cpu.json
      - name: Build distributions
        run: python -m build
